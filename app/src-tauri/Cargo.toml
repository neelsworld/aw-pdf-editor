[package]
name = "aw-pdf-editor"
version = "0.1.1"
description = "AW PDF Editor: free, offline PDF editor (Phase 0 skeleton)"
authors = ["AccredWorks"]
license = "AGPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"

[features]
# Serve the plain HTML in ../ui from inside the app, so `cargo run` works without the Tauri CLI or npm
# (the same setup as AW Signer for Windows).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
