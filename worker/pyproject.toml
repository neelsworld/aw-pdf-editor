[project]
name = "aw-pdf-worker"
version = "0.1.1"
description = "PDF engine worker for AW PDF Editor (one JSON request per run over stdin/stdout)"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["pymupdf==1.28.2", "pillow==13.0.0", "markdown==3.11.2", "pdf2docx==0.5.13", "openpyxl==3.1.5", "python-pptx==1.0.2"]

[project.scripts]
aw-pdf-worker = "aw_pdf_worker.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
